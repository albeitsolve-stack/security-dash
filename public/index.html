<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Gateway</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
        }
        h2 { margin-bottom: 0.5rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ Secure Handshake</h2>
        <p>Verifying secure session parameters...</p>
    </div>

<script>
async function sendTelemetry() {
    try {
        // 1. Quick Canvas Fingerprint
        let canvasSig = "Standard";
        try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = "top";
            ctx.font = "14px Arial";
            ctx.fillText("Security Telemetry", 2, 2);
            canvasSig = canvas.toDataURL().substring(22, 45);
        } catch (e) {}

        // 2. GPU via WebGL
        let gpuInfo = "Standard Renderer";
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    gpuInfo = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                }
            }
        } catch (e) {}

        // 3. Build payload
        const payload = {
            screen: `${window.screen.width}x${window.screen.height}`,
            colorDepth: window.screen.colorDepth || 24,
            pixelRatio: window.devicePixelRatio || 1,
            cpuCores: navigator.hardwareConcurrency || 'Unknown',
            deviceMemory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'Unknown',
            maxTouchPoints: navigator.maxTouchPoints || 0,
            webdriver: navigator.webdriver ? true : false,
            canvasSignature: canvasSig,
            gpu: gpuInfo,
            battery: "Normal",
            network: {
                effectiveType: navigator.connection?.effectiveType || '4g',
                rtt: navigator.connection?.rtt || 50,
                downlink: navigator.connection?.downlink || 10
            },
            peripherals: []
        };

        // 4. Send directly to backend
        await fetch('/api/security-telemetry', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    } catch (err) {
        console.error('Telemetry send failed:', err);
    }
}

// Run immediately on page load
window.onload = sendTelemetry;
</script>
</body>
</html>
